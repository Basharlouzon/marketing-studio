<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Docs — Marketing Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
</head>
<body class="docs-body">
<header class="nav">
  <div class="wrap nav-inner">
    <div class="brand"><span class="mark">MS</span> Marketing Studio</div>
    <nav><a href="index.html">← Home</a><a href="docs.html?doc=about">About</a></nav>
  </div>
</header>
<div class="wrap docs-layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="doc" id="doc"><p class="loading">Loading…</p></main>
</div>
<footer class="footer"><div class="wrap"><div><b>Marketing Studio</b> · docs render the shipped SKILL.md files — they can't drift from the code</div></div></footer>
<script src="app.js"></script>
<script>
const DOCS = [
  ["about", "About"],
  ["inspiration-intake", "0 · inspiration-intake"],
  ["mbk-brand-kit", "1 · brand-kit"],
  ["social-image-studio", "2 · social-image-studio"],
  ["marketing-agent-studio", "3 · marketing-agent-studio"],
  ["remotion-motion-studio", "4 · remotion-motion-studio"],
  ["brand-kit-template", "+ · brand-kit template"],
  ["role-prompts", "· agent role prompts"],
];
const sidebar = document.getElementById("sidebar");
sidebar.innerHTML = DOCS.map(([id, label]) =>
  `<a class="${id === new URLSearchParams(location.search).get("doc") ? "active" : ""}" href="docs.html?doc=${id}">${label}</a>`).join("");
const id = new URLSearchParams(location.search).get("doc") || "about";
if (!DOCS.some(([i]) => i === id)) { document.getElementById("doc").innerHTML = "<p>Unknown doc.</p>"; }
else {
  fetch(`content/${id}.md`)
    .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(md => { document.getElementById("doc").innerHTML = marked.parse(md); })
    .catch(e => { document.getElementById("doc").innerHTML = `<p>Could not load doc (${e.message}).</p>`; });
}
</script>
</body>
</html>
